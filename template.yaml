schema_version: 1
type: reusable_template
id: joomla-installer-script
title: Joomla installer script template
kind: scaffold
version: 1.0.0
description: WebTolk-branded Joomla installer script. Copy files/script.php and adapt the extension-specific values described in prompts/adaptation-notes.md.
inputs:
- id: extension-name
  required: true
- id: minimum-joomla
  required: false
- id: minimum-php
  required: false
outputs:
- path: script.php
- path: 'language/<lang>/{TYPE}_{group}_{element}.ini'
- path: 'language/<lang>/{TYPE}_{group}_{element}.sys.ini'
files:
- source: files/script.php
  target: script.php
- source: 'files/language/en-GB/{TYPE}_{group}_{element}.ini'
  target: 'language/en-GB/{TYPE}_{group}_{element}.ini'
- source: 'files/language/en-GB/{TYPE}_{group}_{element}.sys.ini'
  target: 'language/en-GB/{TYPE}_{group}_{element}.sys.ini'
- source: 'files/language/ru-RU/{TYPE}_{group}_{element}.ini'
  target: 'language/ru-RU/{TYPE}_{group}_{element}.ini'
- source: 'files/language/ru-RU/{TYPE}_{group}_{element}.sys.ini'
  target: 'language/ru-RU/{TYPE}_{group}_{element}.sys.ini'
prompts:
- path: prompts/adaptation-notes.md
tags:
- joomla
- php
- installer
- source-file-template
adaptation_required: true
usage_policy:
  read_readme_first: true
  remove_or_retarget_enable_plugin_for_non_matching_packages: true
  search_for_donor_identifiers_before_commit:
  - WTMAX
  - WT Max
  - wtmax
update_sites:
  - id: webtolk-github
    enabled: true
    channel: stable
    manifest_url: https://github.com/WebTolk/pf-template-webtolk-joomla-installer-script/releases/latest/download/update-manifest.json
    changelog_url: https://github.com/WebTolk/pf-template-webtolk-joomla-installer-script/blob/main/CHANGELOG.md
    trust:
      require_https: true
      require_sha256: true
      allow_unsigned: true
      signature_required: false
    policy:
      check_interval_hours: 24
      auto_check: true
      auto_stage: false
      auto_apply: false
      notify_operator: true
      backup_before_apply: true
      install_path: '${PF_TEMPLATES}/joomla-installer-script'
